<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A12; width: 1400px; height: 880px; overflow: hidden; }
  </style>
</head>
<body>
<svg width="1400" height="880" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <marker id="arr-gold" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#D4A800"/>

      <polygon points="0 0, 9 3.5, 0 7" fill="#6B7080"/>
    </marker>

  <!-- Background -->
  <rect width="1400" height="880" fill="#0A0A12"/>

  <text x="700" y="36" text-anchor="middle" fill="#D4A800" font-size="22" font-weight="bold" letter-spacing="1">IGBC — Application Architecture</text>

  <rect x="55" y="100" width="215" height="6" fill="#1E1A0A"/>

  <text x="163" y="142" text-anchor="middle" fill="#EDE8DC" font-size="11">Koin · MVVM</text>
  <text x="163" y="162" text-anchor="middle" fill="#B0A898" font-size="10">Auth0 Android SDK v4</text>
  <text x="163" y="178" text-anchor="middle" fill="#4CAF82" font-size="10">✅ Login + 7 screens working</text>

  <!-- ═══ iOS BOX ═══ -->
  <rect x="320" y="80" width="215" height="120" rx="6" fill="#14141F" stroke="#D4A800" stroke-width="1.5"/>

  <rect x="320" y="100" width="215" height="6" fill="#1E1A0A"/>

  <text x="428" y="124" text-anchor="middle" fill="#EDE8DC" font-size="11">Swift · SwiftUI</text>
  <text x="428" y="142" text-anchor="middle" fill="#EDE8DC" font-size="11">MVVM · SPM</text>
  <text x="428" y="162" text-anchor="middle" fill="#B0A898" font-size="10">Auth0.swift v3.0.1</text>
  <text x="428" y="178" text-anchor="middle" fill="#4CAF82" font-size="10">✅ Login working (custom scheme)</text>

  <!-- ═══ VUE SPA BOX ═══ -->

  <rect x="960" y="100" width="295" height="6" fill="#0A1A0F"/>

  <text x="1108" y="124" text-anchor="middle" fill="#EDE8DC" font-size="11">Vue 3 · Vite · Pinia</text>

  <text x="1108" y="178" text-anchor="middle" fill="#4CAF82" font-size="10">✅ Login/session/debug working</text>

  <text x="1035" y="322" text-anchor="middle" fill="#B0A898" font-size="10">@auth0/auth0-fastify · Regular Web App</text>
  <text x="1035" y="344" text-anchor="middle" fill="#EDE8DC" font-size="11">GET  /auth/login</text>
  <text x="1035" y="362" text-anchor="middle" fill="#EDE8DC" font-size="11">GET  /auth/callback</text>
  <text x="1035" y="380" text-anchor="middle" fill="#EDE8DC" font-size="11">GET  /auth/logout</text>
  <text x="1035" y="405" text-anchor="middle" fill="#B0A898" font-size="10">Encrypted session cookie · getAccessToken()</text>
  <text x="1035" y="423" text-anchor="middle" fill="#FFB347" font-size="10">⚠️ /api/accounts returns mock data — proxy to Fastify API not wired yet</text>

  <rect x="385" y="280" width="380" height="155" rx="6" fill="#14141F" stroke="#4CAF82" stroke-width="1.5"/>
  <rect x="385" y="280" width="380" height="26" rx="6" fill="#0A1A0F"/>
  <rect x="385" y="300" width="380" height="6" fill="#0A1A0F"/>
  <text x="575" y="297" text-anchor="middle" fill="#4CAF82" font-size="11" font-weight="bold">FASTIFY API  ·  :4000</text>
  <text x="575" y="322" text-anchor="middle" fill="#B0A898" font-size="10">@auth0/auth0-fastify-api · Resource Server</text>
  <text x="575" y="344" text-anchor="middle" fill="#EDE8DC" font-size="11">GET  /health  — public</text>
  <text x="575" y="362" text-anchor="middle" fill="#EDE8DC" font-size="11">GET  /api/accounts  — requireAuth()</text>
  <text x="575" y="390" text-anchor="middle" fill="#B0A898" font-size="10">Validates Bearer token via JWKS</text>
  <text x="575" y="408" text-anchor="middle" fill="#B0A898" font-size="10">request.user.sub  ·  aud: api://sheev/v1</text>
  <text x="575" y="426" text-anchor="middle" fill="#B0A898" font-size="10">Shared by all platforms</text>

  <!-- ═══ AUTH0 BOX ═══ -->
  <rect x="75" y="515" width="1250" height="120" rx="6" fill="#14141F" stroke="#9B7FD4" stroke-width="2"/>
  <rect x="75" y="515" width="1250" height="26" rx="6" fill="#130D1F"/>
  <rect x="75" y="535" width="1250" height="6" fill="#130D1F"/>
  <text x="700" y="531" text-anchor="middle" fill="#9B7FD4" font-size="13" font-weight="bold">AUTH0  ·  auth.sheev.fr  ·  bduvey-training.auth0.com</text>

  <line x1="492" y1="547" x2="492" y2="625" stroke="#2A2040" stroke-width="1"/>
  <line x1="908" y1="547" x2="908" y2="625" stroke="#2A2040" stroke-width="1"/>

  <text x="284" y="568" text-anchor="middle" fill="#EDE8DC" font-size="12" font-weight="bold">Universal Login</text>
  <text x="284" y="588" text-anchor="middle" fill="#B0A898" font-size="10">OAuth 2.0 / OIDC</text>
  <text x="284" y="606" text-anchor="middle" fill="#B0A898" font-size="10">Android · iOS · Web BFF</text>

  <!-- JWKS -->
  <text x="700" y="568" text-anchor="middle" fill="#EDE8DC" font-size="12" font-weight="bold">JWKS Endpoint</text>
  <text x="700" y="588" text-anchor="middle" fill="#B0A898" font-size="10">/.well-known/jwks.json</text>
  <text x="700" y="606" text-anchor="middle" fill="#B0A898" font-size="10">JWT signature validation for API</text>

  <!-- Guardian -->
  <text x="1116" y="568" text-anchor="middle" fill="#EDE8DC" font-size="12" font-weight="bold">Guardian MFA</text>
  <text x="1116" y="588" text-anchor="middle" fill="#B0A898" font-size="10">Push notification challenges</text>
  <text x="1116" y="606" text-anchor="middle" fill="#B0A898" font-size="10">Amazon SNS broker</text>

  <rect x="960" y="710" width="230" height="75" rx="6" fill="#14141F" stroke="#6B7080" stroke-width="1"/>
  <text x="1075" y="738" text-anchor="middle" fill="#B0A898" font-size="11" font-weight="bold">AMAZON SNS</text>
  <text x="1075" y="756" text-anchor="middle" fill="#B0A898" font-size="10">Push notification broker</text>
  <text x="1075" y="773" text-anchor="middle" fill="#B0A898" font-size="10">Auth0 → SNS → FCM / APNs</text>

  <!-- FCM BOX -->
  <rect x="55" y="810" width="215" height="58" rx="6" fill="#14141F" stroke="#6B7080" stroke-width="1"/>
  <text x="163" y="836" text-anchor="middle" fill="#B0A898" font-size="11" font-weight="bold">FCM</text>
  <text x="163" y="854" text-anchor="middle" fill="#B0A898" font-size="10">Android push delivery</text>

  <!-- APNs BOX -->
  <rect x="320" y="810" width="215" height="58" rx="6" fill="#14141F" stroke="#6B7080" stroke-width="1"/>
  <text x="428" y="836" text-anchor="middle" fill="#B0A898" font-size="11" font-weight="bold">APNs</text>
  <text x="428" y="854" text-anchor="middle" fill="#B0A898" font-size="10">iOS push delivery</text>

  <!-- ════════════ ARROWS ════════════ -->

  <!-- Vue SPA → BFF -->
  <line x1="1070" y1="200" x2="1040" y2="278" stroke="#4CAF82" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1088" y="248" fill="#4CAF82" font-size="10">HTTP</text>

  <text x="784" y="348" fill="#FFB347" font-size="9">Not wired yet</text>

  <line x1="980" y1="435" x2="920" y2="513" stroke="#9B7FD4" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="970" y="488" fill="#9B7FD4" font-size="9">OAuth 2.0</text>

  <!-- API → Auth0 (JWKS, dashed) -->
  <line x1="575" y1="435" x2="650" y2="513" stroke="#6B7080" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="582" y="485" fill="#6B7080" font-size="9">JWKS</text>

  <!-- Android → Auth0 (Universal Login) -->
  <path d="M 130 200 Q 90 370 190 513" stroke="#D4A800" stroke-width="1.5" fill="none" marker-end="url(#arr-gold)"/>
  <text x="65" y="345" fill="#D4A800" font-size="9">Universal</text>
  <text x="65" y="358" fill="#D4A800" font-size="9">Login</text>

  <!-- iOS → Auth0 (Universal Login) -->

  <text x="292" y="224" fill="#D4A800" font-size="9">Bearer</text>
  <text x="292" y="237" fill="#D4A800" font-size="9">token</text>

  <!-- Auth0 Guardian → SNS -->
  <line x1="1116" y1="635" x2="1075" y2="708" stroke="#6B7080" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- SNS → FCM -->
  <path d="M 980 748 Q 700 790 272 808" stroke="#6B7080" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-gray)"/>

  <!-- SNS → APNs -->
  <path d="M 990 765 Q 800 800 537 808" stroke="#6B7080" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-gray)"/>

  <!-- FCM → Android (push back, left side) -->
  <path d="M 90 810 Q 55 730 75 202" stroke="#6B7080" stroke-width="1" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-gray)"/>

  <!-- APNs → iOS (push back) -->
  <path d="M 355 810 Q 320 730 345 202" stroke="#6B7080" stroke-width="1" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-gray)"/>

  <!-- ═══ LEGEND ═══ -->

  <text x="752" y="97" text-anchor="middle" fill="#B0A898" font-size="10" font-weight="bold">LEGEND</text>

  <line x1="588" y1="117" x2="638" y2="117" stroke="#D4A800" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  <text x="648" y="121" fill="#EDE8DC" font-size="10">Direct auth (Bearer / Universal Login)</text>

  <line x1="588" y1="136" x2="638" y2="136" stroke="#D4A800" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-gold)"/>
  <text x="648" y="140" fill="#EDE8DC" font-size="10">Bearer token (mobile → API direct)</text>

  <line x1="588" y1="155" x2="638" y2="155" stroke="#4CAF82" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="648" y="159" fill="#EDE8DC" font-size="10">Web / BFF flow</text>

  <line x1="588" y1="174" x2="638" y2="174" stroke="#9B7FD4" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="648" y="178" fill="#EDE8DC" font-size="10">OAuth 2.0 (BFF ↔ Auth0)</text>

  <line x1="588" y1="193" x2="638" y2="193" stroke="#6B7080" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="648" y="197" fill="#EDE8DC" font-size="10">JWKS / Guardian push</text>

  <line x1="588" y1="212" x2="638" y2="212" stroke="#6B7080" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr-gray)"/>
  <text x="648" y="216" fill="#EDE8DC" font-size="10">Push notification delivery</text>

</svg>
